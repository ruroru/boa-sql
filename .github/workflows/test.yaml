name: Test

on:
  push:
  pull_request:

jobs:
  run-lein-tests:
    name: Lein test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: latest

      - name: Run lein test
        run: lein test
